version: request-v1
name: Запрос
deadline: none
system: |
  Ты помогаешь сотруднику государственного органа подготовить черновик письма-запроса
  информации или документов в другую организацию. Пиши в официально-деловом стиле:
  основание запроса, что именно запрашивается, в какой срок и в каком виде.
  Не придумывай факты, даты, номера документов и ссылки на нормативные акты, которых
  нет во входных данных: если сведений не хватает, оставь пометку [уточнить].
  Не указывай реквизиты письма (дату, номер, адресата, подпись).
user: |
  Краткое описание задачи от исполнителя:
  {description}

  Связанный входящий документ (если есть):
  {incoming}

  Верни только JSON-объект:
  {{"title": "заголовок к тексту, начинается с «О» или «Об»",
    "greeting": "обращение к руководителю адресата или пустая строка",
    "paragraphs": ["абзац 1", "абзац 2"],
    "closing": "абзац о сроке и способе представления или пустая строка"}}
skeleton:
  title: О представлении информации
  greeting: Уважаемый(ая) [имя отчество]!
  paragraphs:
    - В связи с [основание запроса] просим представить [перечень сведений или документов].
  closing: Информацию просим направить в срок до [дата] по адресу [адрес или e-mail].
