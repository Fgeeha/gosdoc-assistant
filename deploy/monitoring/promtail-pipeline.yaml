# Фрагмент конфигурации агента сбора логов (Promtail / Grafana Alloy в режиме
# promtail) для заказанного Loki. Приложение пишет в stdout JSON-строки:
#   {"ts": ..., "level": ..., "logger": ..., "msg": ..., "exc": ...}
# ПДн в сообщениях маскируются приложением до записи (core/logging.py).
scrape_configs:
  - job_name: gosdoc
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: gosdoc
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        target_label: component
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    pipeline_stages:
      - cri: {}
      - json:
          expressions:
            level: level
            logger: logger
            ts: ts
      # level — метка (мало значений); logger — нет, чтобы не раздувать индекс Loki.
      - labels:
          level:
      - timestamp:
          source: ts
          format: RFC3339Nano
