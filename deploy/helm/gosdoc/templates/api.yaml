{{- $name := printf "%s-api" (include "gosdoc.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "gosdoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "gosdoc.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "gosdoc.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- include "gosdoc.pod" . | nindent 6 }}
      initContainers:
        {{- include "gosdoc.waitInit" (dict "root" . "deps" "postgres,redis" "migrations" true) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "gosdoc.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "gosdoc.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", {{ .Values.api.forwardedAllowIps | quote }}]
          ports: [{name: http, containerPort: 8000}]
          {{- include "gosdoc.env" . | nindent 10 }}
          {{- include "gosdoc.mounts" . | nindent 10 }}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes: {{- include "gosdoc.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "gosdoc.labels" . | nindent 4 }}
spec:
  selector: {{- include "gosdoc.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports: [{name: http, port: 8000, targetPort: http}]
