# Проверка в GitHub: линтеры, тесты, Helm-чарт, сборка образов.
# Образы собираются на dev-базе python:3.11-slim (ADR-0007). При push в Master,
# develop и по тегам v* они публикуются в ghcr.io как dev-сборки; в остальных
# случаях только проверяется сборка. Прод-образы на Astra Linux / РЕД ОС
# собирает конвейер в контуре (.gitflic-ci.yml).
name: CI

on:
  push:
    branches: [Master, develop, "feature/**", "bugfix/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # LibreOffice — для теста сборки PDF письма.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
      - run: uv sync --frozen
      - run: uv run pytest --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: report.xml

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make helm-lint

  build:
    needs: [lint, test, helm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, frontend]
    env:
      # Из форков и веток задач образы не публикуются.
      PUSH: ${{ github.event_name == 'push' && (github.ref_name == 'Master' || github.ref_name == 'develop' || github.ref_type == 'tag') }}
    steps:
      - uses: actions/checkout@v4
      # Статика фронтенда собирается здесь и копируется в образ готовой (ADR-0007).
      - uses: actions/setup-node@v4
        if: matrix.target == 'frontend'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-dist
        if: matrix.target == 'frontend'
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'frontend'
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Теги: имя ветки, версия из тега v* (и latest), sha коммита.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/gosdoc-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: BASE_IMAGE=python:3.11-slim
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
