[alembic]
script_location = %(here)s/backend/alembic
prepend_sys_path = %(here)s/backend
# URL берётся из DATABASE_URL (gosdoc.core.config), здесь не указывается.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
