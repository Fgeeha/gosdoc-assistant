<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Три раздела системы</title>
  <desc id="desc">Проверка документа: замечания трёх уровней с цитатой нормы. Подготовка письма: поля 20, 10, 20, 20 мм, Times New Roman 14, срок ответа 30 дней. Перенос таблиц на тестовых данных: 11 строк — 4 перенесено, 2 отфильтровано, 5 отклонено с причиной.</desc>

  <rect width="1200" height="500" rx="24" fill="#F3EEE2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#13203A">

    <!-- 01 Проверка -->
    <g id="check">
      <rect x="48" y="40" width="352" height="420" rx="16" fill="#FFFDF8" stroke="#E2DACB" stroke-width="1.5"/>
      <text x="72" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#8C6A2A">01 · ПРОВЕРКА</text>
      <text x="72" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700">Документ и НПА</text>

      <rect x="72" y="160" width="118" height="40" rx="8" fill="#D64532"/>
      <text x="131" y="186" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#FFFFFF">КРИТИЧНО</text>
      <text x="204" y="188" font-size="20">акт утратил силу</text>

      <rect x="72" y="216" width="118" height="40" rx="8" fill="#E3A72F"/>
      <text x="131" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#13203A">ВНИМАНИЕ</text>
      <text x="204" y="244" font-size="20">старая редакция</text>

      <rect x="72" y="272" width="118" height="40" rx="8" fill="#DCE1EA"/>
      <text x="131" y="298" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#13203A">К СВЕДЕНИЮ</text>
      <text x="204" y="300" font-size="20">акта нет в базе</text>

      <line x1="72" y1="340" x2="376" y2="340" stroke="#E2DACB" stroke-width="1.5"/>
      <text x="72" y="384" font-size="20" font-weight="600">К каждому замечанию —</text>
      <text x="72" y="412" font-size="20" font-weight="600">дословная цитата нормы</text>
    </g>

    <!-- 02 Письма -->
    <g id="letters">
      <rect x="424" y="40" width="352" height="420" rx="16" fill="#FFFDF8" stroke="#E2DACB" stroke-width="1.5"/>
      <text x="448" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#8C6A2A">02 · ПИСЬМА</text>
      <text x="448" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700">Ответ по ГОСТ</text>

      <rect x="448" y="158" width="124" height="166" rx="4" fill="#FFFFFF" stroke="#C9C1B0" stroke-width="1.5"/>
      <line x1="466" y1="164" x2="466" y2="318" stroke="#9AA3B5" stroke-dasharray="3 4"/>
      <line x1="563" y1="164" x2="563" y2="318" stroke="#9AA3B5" stroke-dasharray="3 4"/>
      <rect x="474" y="174" width="44" height="6" rx="2" fill="#13203A"/>
      <rect x="522" y="190" width="36" height="5" rx="2" fill="#9AA3B5"/>
      <rect x="522" y="200" width="36" height="5" rx="2" fill="#9AA3B5"/>
      <rect x="474" y="222" width="84" height="5" rx="2" fill="#13203A"/>
      <rect x="480" y="236" width="78" height="4" rx="2" fill="#9AA3B5"/>
      <rect x="474" y="246" width="84" height="4" rx="2" fill="#9AA3B5"/>
      <rect x="474" y="256" width="84" height="4" rx="2" fill="#9AA3B5"/>
      <rect x="480" y="270" width="78" height="4" rx="2" fill="#9AA3B5"/>
      <rect x="474" y="280" width="60" height="4" rx="2" fill="#9AA3B5"/>
      <rect x="474" y="300" width="40" height="5" rx="2" fill="#13203A"/>

      <text x="592" y="176" font-size="16" fill="#6B7280">поля, мм</text>
      <text x="592" y="200" font-size="20" font-weight="700">20 · 10 · 20 · 20</text>
      <text x="592" y="236" font-size="16" fill="#6B7280">шрифт</text>
      <text x="592" y="260" font-size="20" font-weight="700">Times 14 пт</text>
      <text x="592" y="296" font-size="16" fill="#6B7280">срок ответа</text>
      <text x="592" y="320" font-size="20" font-weight="700" fill="#2F7D4F">30 дней</text>

      <line x1="448" y1="340" x2="752" y2="340" stroke="#E2DACB" stroke-width="1.5"/>
      <text x="448" y="384" font-size="20" font-weight="600">Реквизиты на местах,</text>
      <text x="448" y="412" font-size="20" font-weight="600">DOCX и PDF, версии</text>
    </g>

    <!-- 03 Таблицы -->
    <g id="tables">
      <rect x="800" y="40" width="352" height="420" rx="16" fill="#FFFDF8" stroke="#E2DACB" stroke-width="1.5"/>
      <text x="824" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#8C6A2A">03 · ТАБЛИЦЫ</text>
      <text x="824" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700">Из A в B</text>

      <text x="824" y="200" font-size="50" font-weight="700">11 = 4 + 2 + 5</text>
      <rect x="824" y="220" width="111" height="22" rx="4" fill="#2F7D4F"/>
      <rect x="937" y="220" width="54" height="22" rx="4" fill="#9AA3B5"/>
      <rect x="993" y="220" width="135" height="22" rx="4" fill="#D64532"/>

      <circle cx="832" cy="268" r="6" fill="#2F7D4F"/>
      <text x="848" y="275" font-size="20">4 перенесено</text>
      <circle cx="832" cy="296" r="6" fill="#9AA3B5"/>
      <text x="848" y="303" font-size="20">2 отфильтровано</text>
      <circle cx="832" cy="324" r="6" fill="#D64532"/>
      <text x="848" y="331" font-size="20">5 отклонено с причиной</text>

      <line x1="824" y1="350" x2="1128" y2="350" stroke="#E2DACB" stroke-width="1.5"/>
      <text x="824" y="384" font-size="20" font-weight="600">Ни одна строка</text>
      <text x="824" y="412" font-size="20" font-weight="600">не теряется</text>
    </g>
  </g>
</svg>
