<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Всё внутри контура организации</title>
  <desc id="desc">Браузер обращается к nginx и API. API пишет в PostgreSQL, Redis и SeaweedFS и ставит задачи в очередь RabbitMQ; воркеры используют поиск по НПА и модель. Все сервисы находятся внутри контура организации, исходящих запросов во внешние API нет.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8C97AD"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#13203A"/>

  <g id="perimeter">
    <rect x="40" y="40" width="904" height="320" rx="18" fill="#182847" stroke="#E3A72F" stroke-width="2" stroke-dasharray="10 8"/>
    <rect x="64" y="28" width="356" height="26" fill="#13203A"/>
    <text x="72" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#E3A72F">КОНТУР ОРГАНИЗАЦИИ · 152-ФЗ</text>
  </g>

  <g id="nodes" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#F5EFE3" text-anchor="middle">
    <g fill="#22355A" stroke="#3A5280" stroke-width="1.5">
      <rect x="72" y="120" width="150" height="52" rx="10"/>
      <rect x="262" y="120" width="130" height="52" rx="10"/>
      <rect x="432" y="120" width="150" height="52" rx="10"/>
      <rect x="432" y="250" width="150" height="52" rx="10"/>
      <rect x="262" y="250" width="130" height="52" rx="10"/>
    </g>
    <text x="147" y="153">Браузер</text>
    <text x="327" y="153">nginx</text>
    <text x="507" y="153" font-weight="700">API</text>
    <text x="507" y="283">RabbitMQ</text>
    <text x="327" y="283" font-weight="700">Воркеры</text>

    <g fill="#FAF6EC">
      <rect x="664" y="76" width="264" height="46" rx="10"/>
      <rect x="664" y="132" width="264" height="46" rx="10"/>
      <rect x="664" y="188" width="264" height="46" rx="10"/>
      <rect x="664" y="244" width="264" height="46" rx="10"/>
      <rect x="664" y="300" width="264" height="46" rx="10"/>
    </g>
    <g fill="#13203A" text-anchor="start">
      <text x="684" y="106">PostgreSQL <tspan font-size="16" fill="#6B7280">данные, аудит</tspan></text>
      <text x="684" y="162">Redis <tspan font-size="16" fill="#6B7280">сессии</tspan></text>
      <text x="684" y="218">SeaweedFS <tspan font-size="16" fill="#6B7280">файлы, 30 дн.</tspan></text>
      <text x="684" y="274">Поиск по НПА <tspan font-size="16" fill="#6B7280">ES + векторы</tspan></text>
      <text x="684" y="330">Модель <tspan font-size="16" fill="#6B7280">в контуре</tspan></text>
    </g>
  </g>

  <g id="links" fill="none" stroke="#8C97AD" stroke-width="2">
    <path d="M222 146 H258" marker-end="url(#arrow)"/>
    <path d="M392 146 H428" marker-end="url(#arrow)"/>
    <path d="M507 172 V246" marker-end="url(#arrow)"/>
    <path d="M432 276 H396" marker-end="url(#arrow)"/>
    <path d="M582 146 H620 V99 H660" marker-end="url(#arrow)"/>
    <path d="M620 146 V211 H660" marker-end="url(#arrow)"/>
    <path d="M620 155 H660"/>
    <path d="M327 302 V330 H620 V267 H660" marker-end="url(#arrow)"/>
    <path d="M620 323 H660" marker-end="url(#arrow)"/>
  </g>

  <g id="outside" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M944 200 H1012" stroke="#D64532" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M966 188 L990 212 M990 188 L966 212" stroke="#D64532" stroke-width="4" stroke-linecap="round"/>
    <rect x="1012" y="150" width="148" height="100" rx="12" fill="none" stroke="#5A6680" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="1086" y="190" text-anchor="middle" font-size="20" fill="#8C97AD">внешние</text>
    <text x="1086" y="216" text-anchor="middle" font-size="20" fill="#8C97AD">API, облака</text>
    <text x="1086" y="290" text-anchor="middle" font-size="18" fill="#F5EFE3">нет исходящих</text>
    <text x="1086" y="314" text-anchor="middle" font-size="18" fill="#F5EFE3">запросов</text>
  </g>
</svg>
