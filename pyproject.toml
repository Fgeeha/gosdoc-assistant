[project]
name = "gosdoc"
version = "0.1.0"
description = "ГосДок Ассистент: проверка документов по НПА, подготовка писем, перенос данных между таблицами"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "dramatiq[rabbitmq]>=1.17",
    "boto3>=1.35",
    "argon2-cffi>=23.1",
    "ldap3>=2.9",
    "httpx>=0.28",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "odfpy>=1.4.1",
]

[project.scripts]
gosdoc = "gosdoc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "testcontainers[postgres]>=4.8",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gosdoc", "workers"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях
    "B008",  # Depends(...) в аргументах — штатный приём FastAPI
    "E501",  # длину строк держит ruff format; длинные строки-литералы не режем
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"backend/gosdoc/core/health.py" = ["BLE001"]
"backend/gosdoc/cli.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
packages = ["gosdoc", "workers"]
mypy_path = "backend"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
# Внешняя сеть в тестах запрещена: разрешены только loopback (testcontainers) и unix-сокеты.
addopts = "--allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
markers = ["integration: нужен Docker (testcontainers)"]
